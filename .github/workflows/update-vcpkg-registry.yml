name: Update vcpkg Registry

# On every version tag (vX.Y.Z), update the flatbuffers-request port in
# alexames/vcpkg-registry to point at the tagged commit. The port must already
# exist in the registry (the initial 0.1.0 entry was created by hand); this
# only bumps REF/SHA512 and the version.
#
# Requires a repository secret VCPKG_REGISTRY_TOKEN: a fine-grained PAT with
# "Contents: Read and write" on alexames/vcpkg-registry.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  update-port:
    uses: alexames/vcpkg-registry/.github/workflows/update-port.yml@main
    secrets:
      registry-token: ${{ secrets.VCPKG_REGISTRY_TOKEN }}
