name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,    os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: Linux Clang,  os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: Windows MSVC, os: windows-latest }
          - { name: macOS Clang,  os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${{ matrix.cxx }}" ]; then
            EXTRA="-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"
          fi
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_FEATURES="tests;tools" \
            $EXTRA
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        shell: bash
        run: |
          find include src test fuzz \
            \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: abort_on_error=1:detect_container_overflow=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_FEATURES="tests;tools" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    name: Fuzz smoke (30s)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_container_overflow=0
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DFBREQUEST_BUILD_TESTS=OFF \
            -DFBREQUEST_BUILD_FUZZERS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer"
      - name: Build fuzzer
        run: cmake --build build --target fbrequest_fuzz_parse
      - name: Run fuzzer
        run: ./build/fuzz/fbrequest_fuzz_parse -max_total_time=30 -print_final_stats=1
